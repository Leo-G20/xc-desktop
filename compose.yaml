services:
  xc:
    image: ghcr.io/leo-g20/xc-desktop:latest
    # With rootless Podman, uncomment userns_mode so xc can write to ./workspace
    # userns_mode: "keep-id:uid=1000,gid=1000"
    ports:
      - "127.0.0.1:8080:8080"
      # For SSH, uncomment this port and XC_ENABLE_SSH below.
      # - "127.0.0.1:2332:2332"
    shm_size: 2gb
    environment:
      # XC_ENABLE_SSH: "true"
      # Set SELKIES_PASSWORD to choose a different desktop password.
      PASSWD: ${SELKIES_PASSWORD:-1234}
      LIBGL_ALWAYS_SOFTWARE: "true"
      SELKIES_USE_CPU: "true"
      SELKIES_ENCODER: h264enc
    volumes:
      - ./workspace:/home/xc
