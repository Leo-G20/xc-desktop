name: Build and publish image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Enter the full 40-character commit SHA from xc-desktop. The Containerfile selects the XC revision"
        required: true
        type: string

jobs:

  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate commit SHA
        id: source
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Enter a full lowercase 40-character commit SHA (received ${#COMMIT} characters)." >&2
            echo "To get the current commit, run: git rev-parse HEAD" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Confirm checkout
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # Registry cache options disabled for the uncached build test.
          # --cache-from "type=registry,ref=${IMAGE}:buildcache"
          # --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max"
          docker buildx build \
            --file Containerfile \
            --no-cache \
            --tag "${IMAGE}:sha-${COMMIT}" \
            --tag "${IMAGE}:latest" \
            --push .
